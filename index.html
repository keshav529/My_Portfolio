    <!-- Primary SEO Metadata (updated dynamically per route via RouteMeta) -->
    <title>Keshav Anand — Web Developer &amp; UI Designer</title>
    <meta
      name="description"
      content="Portfolio of Keshav Anand, a BCA student (2022–2025) and aspiring software developer building fast, responsive web experiences with HTML, CSS, JavaScript, and React."

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#121212' : '#e7e2dc');
        }
      })();
    </script>

    <link rel="canonical" href="https://my-portfolio-keshav529.vercel.app/" />
