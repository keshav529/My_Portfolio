<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Metadata -->
    <title>Keshav Anand — Web Developer &amp; UI Designer</title>
    <meta
      name="description"
      content="Portfolio of Keshav Anand, a BCA student and aspiring software developer building fast, responsive web applications with HTML, CSS, JavaScript, and React."
    />
    <meta name="author" content="Keshav Anand" />
    <meta name="theme-color" content="#e7e2dc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#121212' : '#e7e2dc');
        }
      })();
    </script>

    <!-- Open Graph / Social Share Card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keshav Anand Portfolio" />
    <meta property="og:title" content="Keshav Anand — Web Developer &amp; UI Designer" />
    <meta
      property="og:description"
      content="Explore web development projects, Figma UI designs, education, and resume of Keshav Anand (BCA 2022–2025)."
